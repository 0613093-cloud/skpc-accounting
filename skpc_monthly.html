<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서부광성교회 부서보고서 (입력전용)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a6e;--navy-d:#0f2347;--navy-m:#254f94;
  --blue:#4a90c4;--blue-l:#6badd6;--blue-pale:#e8f2f9;--blue-xp:#f0f6fb;
  --gold:#c8963e;--gold-l:#f5e8d3;
  --red:#c0392b;--red-l:#fdf0ef;
  --green:#1a7a4a;--green-l:#eaf5ee;
  --g1:#2c3e50;--g2:#546e8a;--g3:#8fa5b8;--g4:#c8d8e8;--g5:#e8eff6;--g6:#f4f7fa;
  --white:#fff;
  --fn:'Nanum Gothic','Malgun Gothic',sans-serif;
  --fnum:'Arial','Helvetica Neue',sans-serif;
  --r:8px;--rl:12px;
  --sh:0 2px 8px rgba(26,58,110,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}body{height:100%;font-family:var(--fn);font-size:14px;background:var(--g6);color:var(--g1);display:flex;flex-direction:column;overflow:hidden}
.num{font-family:var(--fnum)!important}
/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* HEADER */
.hdr{background:linear-gradient(135deg,var(--navy-d) 0%,var(--navy) 60%,var(--navy-m) 100%);
  padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0;z-index:100}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--blue-l)}
.hdr-logo span{font-size:8px;font-weight:800;color:var(--navy);letter-spacing:.3px;text-align:center;line-height:1.2}
.hdr-title h1{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px}
.hdr-title p{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.hdr-date{font-family:var(--fnum);font-size:12px;color:rgba(255,255,255,.7)}
/* NAV */
.nav{background:var(--navy);display:flex;overflow-x:auto;flex-shrink:0;border-bottom:2px solid rgba(255,255,255,.08)}
.nav::-webkit-scrollbar{height:8px}.nav::-webkit-scrollbar-track{background:var(--navy-d)}.nav::-webkit-scrollbar-thumb{background:var(--blue-l);border-radius:4px;border:1px solid var(--navy)}.nav::-webkit-scrollbar-thumb:hover{background:#fff}
.nav-item{padding:0 18px;height:44px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.6);cursor:pointer;
  white-space:nowrap;font-size:12px;font-weight:700;transition:all .2s;border-bottom:3px solid transparent;flex-shrink:0}
.nav-item:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;border-bottom-color:var(--blue-l);background:rgba(74,144,196,.15)}
/* CONTENT */
.content{flex:1;min-height:0;padding:20px 24px;overflow-y:auto;overflow-x:hidden}
.tab-pane{display:none}.tab-pane.active{display:block}
/* SCROLLBARS - thick & visible */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--g5);border-radius:5px}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:5px;border:2px solid var(--g5)}
::-webkit-scrollbar-thumb:hover{background:var(--navy)}
.tbl-wrap::-webkit-scrollbar{height:12px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--navy);border-radius:6px}
/* PAGE HEADER */
.pg-hd{margin-bottom:16px}
.pg-title{font-size:19px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.pg-title::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,var(--blue) 0%,transparent 100%);margin-left:8px}
/* CARDS */
.card{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px}
.card-title::before{content:'';width:3px;height:13px;background:var(--blue);border-radius:2px;display:inline-block}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* STAT CARDS */
.stat{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);padding:14px 18px;box-shadow:var(--sh)}
.stat-lbl{font-size:10px;font-weight:700;color:var(--g2);letter-spacing:.4px;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-family:var(--fnum);font-size:20px;font-weight:700;color:var(--navy)}
.stat-sub{font-size:10px;color:var(--g3);margin-top:3px}
.stat.blue{border-left:4px solid var(--blue);background:var(--blue-xp)}
.stat.navy{border-left:4px solid var(--navy);background:#f0f3f8}
.stat.gold{border-left:4px solid var(--gold);background:#faf6f0}
.stat.green{border-left:4px solid var(--green);background:var(--green-l)}
.stat.red{border-left:4px solid var(--red);background:var(--red-l)}
/* FORM */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.flbl{font-size:11px;font-weight:800;color:var(--g2);letter-spacing:.3px}
.finp,.fsel{height:36px;padding:0 10px;border:1.5px solid var(--g4);border-radius:var(--r);
  font-family:var(--fn);font-size:13px;color:var(--g1);background:#fff;
  transition:border .15s,box-shadow .15s;width:100%}
.finp.num-in{font-family:var(--fnum)}
.finp:focus,.fsel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,144,196,.15)}
.finp[readonly]{background:var(--g6);color:var(--g2);border-color:var(--g5)}
.finp.yellow-in{background:#fffde7;border-color:#f9ca24;font-family:var(--fnum);font-weight:700;color:#7c6a00}
/* RADIO PILLS */
.rpwrap{display:flex;flex-wrap:wrap;gap:6px}
.rpill{display:flex;align-items:center;gap:5px;padding:5px 12px;border:1.5px solid var(--g4);border-radius:30px;
  cursor:pointer;font-size:12px;font-weight:700;transition:all .18s;background:#fff;color:var(--g2);user-select:none}
.rpill:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-xp)}
.rpill.on{border-color:var(--navy);background:var(--navy);color:#fff}
.rpill input{display:none}
/* BUTTONS - all same height 36px */
.btn{height:36px;padding:0 16px;border:none;border-radius:var(--r);font-family:var(--fn);font-size:13px;
  font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
  white-space:nowrap;min-width:80px;justify-content:center}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-d)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-l)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(1.1)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.1)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{filter:brightness(1.1)}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--g4)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{height:30px;padding:0 12px;font-size:11px;min-width:60px}
.btn-xs{height:26px;padding:0 10px;font-size:11px;min-width:50px}
/* ALERTS */
.alert{border-radius:var(--r);padding:9px 12px;font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.alert-info{background:var(--blue-pale);color:#1a4f7a;border-left:4px solid var(--blue)}
.alert-success{background:var(--green-l);color:#0d5a38;border-left:4px solid var(--green)}
.alert-warn{background:#fef9e7;color:#7d5a00;border-left:4px solid var(--gold)}
/* TABLES */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--g4)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
table.tbl th{background:linear-gradient(180deg,#f0f4f9 0%,#e8eff6 100%);padding:8px 10px;
  text-align:left;border-bottom:2px solid var(--g4);font-size:11px;font-weight:800;color:var(--g2);
  white-space:nowrap;letter-spacing:.3px}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--g5);color:var(--g1);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:var(--blue-xp)}
table.tbl td.nc,.tbl th.nc{font-family:var(--fnum);text-align:right}
table.tbl tfoot td{background:linear-gradient(180deg,#e8eff6,#dce6f0);font-weight:800;color:var(--navy)}
.tbl-empty{text-align:center;padding:28px;color:var(--g3);font-size:13px}
/* Inline editable cell */
.edit-cell{background:#fff;border:1.5px solid var(--blue);border-radius:4px;padding:3px 6px;
  font-family:var(--fn);font-size:12px;width:100%;min-width:60px}
/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800}
.b-navy{background:#e8f0f8;color:var(--navy)}.b-blue{background:var(--blue-pale);color:#1e5f8a}
.b-green{background:var(--green-l);color:var(--green)}.b-red{background:var(--red-l);color:var(--red)}
.b-gold{background:var(--gold-l);color:#8a6022}.b-gray{background:var(--g5);color:var(--g2)}
/* SEARCH PANEL */
.search-panel{background:var(--blue-xp);border:1.5px solid var(--blue-pale);border-radius:var(--rl);
  padding:16px;margin-bottom:12px}
.search-panel .panel-title{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.search-panel .panel-title::before{content:'🔍';font-size:13px}
.result-section{display:none}
.result-section.show{display:block}
/* FLEX UTILS */
.flex{display:flex}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}
.items-c{align-items:center}.jend{justify-content:flex-end}.jbet{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
/* MONTH BAR */
.month-bar{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);padding:12px 18px;
  margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);flex-wrap:wrap}
/* 보고 기준 월 영역 상단 고정 (스크롤해도 계속 보임) */
.dept-sticky-hd{position:sticky;top:0;z-index:50;background:var(--bg,#f0f4f8);
  padding-top:8px;margin:-8px -4px 0;padding-left:4px;padding-right:4px;
  box-shadow:0 4px 12px -6px rgba(0,0,0,.15)}
.dept-sticky-hd .month-bar{margin-bottom:10px}
.month-bar label{font-size:12px;font-weight:800;color:var(--g2)}
.month-bar select{height:34px;padding:0 10px;border:1.5px solid var(--blue);border-radius:var(--r);
  font-family:var(--fn);font-size:13px;font-weight:700;color:var(--navy);background:var(--blue-xp)}
.m-badge{font-family:var(--fnum);font-size:12px;background:var(--navy);color:#fff;padding:4px 12px;border-radius:20px}
/* REPORT */
.rpt-hd{text-align:center;padding:18px 0 14px;border-bottom:2px solid var(--navy);margin-bottom:18px}
.rpt-hd h2{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-1px}
.rpt-meta{display:flex;justify-content:flex-end;gap:18px;font-size:12px;color:var(--g2);margin-bottom:10px}
.rpt-sub{font-size:14px;font-weight:800;color:var(--navy-m);text-align:center;padding:10px;
  background:var(--blue-pale);border-radius:var(--r);margin:14px 0 8px}
/* BANK */
.acct-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.acct-card{border-radius:var(--rl);padding:12px 14px;border:1px solid}
.acct-card.gen{background:#f0f6fb;border-color:var(--blue-l)}
.acct-card.bld{background:#f5f0fb;border-color:#9b59b6}
.acct-card.mis{background:var(--green-l);border-color:var(--green)}
.acct-card.com{background:#fef9e7;border-color:var(--gold)}
.acct-lbl{font-size:10px;font-weight:800;color:var(--g2);margin-bottom:3px}
.acct-num{font-size:10px;color:var(--g3);margin-bottom:5px}
.acct-val{font-family:var(--fnum);font-size:16px;font-weight:700;color:var(--navy)}
.acct-diff{font-family:var(--fnum);font-size:11px;margin-top:3px;font-weight:700}
.d-ok{color:var(--green)}.d-fail{color:var(--red)}.d-zero{color:var(--g3)}
.yellow-inp{width:100%;margin-top:6px;padding:5px 8px;border:2px solid #f9ca24;border-radius:var(--r);
  font-family:var(--fnum);font-size:12px;font-weight:700;background:#fffde7;text-align:right}
/* MATCH */
.match-box{border-radius:var(--r);padding:10px 14px;margin-top:10px;border:1.5px solid}
.match-ok{background:#eafaf1;border-color:#27ae60;color:#1e8449}
.match-fail{background:var(--red-l);border-color:var(--red);color:var(--red)}
.match-pend{background:var(--g6);border-color:var(--g4);color:var(--g3)}
.match-val{font-family:var(--fnum);font-size:14px;font-weight:700}
/* CASH TABLE */
.cash-tbl{width:100%;border-collapse:collapse}
.cash-tbl th,.cash-tbl td{border:1px solid var(--g4);padding:6px 10px;font-size:12px}
.cash-tbl th{background:var(--g6);font-weight:800;text-align:center;color:var(--g2)}
.cash-tbl td:last-child{font-family:var(--fnum);text-align:right}
.cash-tbl input[type=number]{width:72px;padding:3px 6px;border:1px solid var(--g4);
  border-radius:4px;font-family:var(--fnum);text-align:right;font-size:12px}
/* MANAGE */
.mg-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--g5)}
.mg-item:last-child{border:none}
.sub-nav{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.sub-btn{padding:5px 14px;border-radius:20px;border:1.5px solid var(--g4);font-size:12px;font-weight:800;
  cursor:pointer;background:#fff;color:var(--g2);transition:all .15s}
.sub-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sub-btn:hover:not(.on){border-color:var(--blue);color:var(--blue)}
/* DEPT REPORT */
.dr-card{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);margin-bottom:14px}
.dr-head{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.dr-head h3{font-size:13px;font-weight:800;color:#fff}
.dr-officers{font-size:11px;color:rgba(255,255,255,.8);display:flex;gap:14px;align-items:center}
.dr-officers input{height:26px;padding:0 8px;border:1px solid rgba(255,255,255,.4);border-radius:4px;
  background:rgba(255,255,255,.15);color:#fff;font-family:var(--fn);font-size:11px;width:80px}
.dr-officers input::placeholder{color:rgba(255,255,255,.6)}
.dr-body{padding:14px}
.dr-row{align-items:center;display:grid;grid-template-columns:105px minmax(140px,1.5fr) 95px 95px 105px 95px;border-bottom:1px solid var(--g5)}
.dr-row:first-child{background:var(--g6);font-size:11px;font-weight:800;color:var(--g2)}
.dr-row .dc{padding:6px 8px;font-size:12px;border-right:1px solid var(--g5);font-family:var(--fnum);overflow:hidden}
.dr-row .dc:last-child{border-right:none}
.dr-row input{border:none;padding:5px 7px;font-size:12px;background:transparent;width:100%;height:30px;font-family:var(--fn)}
.dr-row input:focus{outline:2px solid var(--blue);border-radius:3px;z-index:1}
.dr-foot{background:var(--blue-pale);display:grid;grid-template-columns:105px minmax(140px,1.5fr) 95px 95px 105px 95px;font-weight:800;color:var(--navy)}
.dr-foot .dc{padding:7px 8px;border-right:1px solid var(--blue-pale);font-family:var(--fnum);text-align:right;font-size:12px}
.dr-foot .dc:first-child{text-align:center;font-family:var(--fn)}
.dr-foot2{background:var(--navy);display:grid;grid-template-columns:105px minmax(140px,1.5fr) 95px 95px 105px 95px;font-weight:800;color:#fff}
.dr-foot2 .dc{padding:7px 8px;border-right:1px solid rgba(255,255,255,.15);font-family:var(--fnum);text-align:right;font-size:12px}
.dr-foot2 .dc:first-child{text-align:center;font-family:var(--fn)}
/* RECEIPT */
.rct-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:4px;color:var(--navy);margin-bottom:5px}
.rct-date{text-align:right;font-family:var(--fnum);font-size:11px;color:var(--g2);margin-bottom:10px}
.approv-tbl{border-collapse:collapse;font-size:12px}
.approv-tbl th,.approv-tbl td{border:1px solid #999;padding:6px 24px;text-align:center}
.approv-tbl th{background:#e8eff6;font-weight:800;color:var(--navy)}
.approv-tbl td{height:44px;min-width:90px}
.rct-tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.rct-tbl th{border:1px solid #aaa;padding:4px 5px;text-align:center;background:#e8eff6;font-weight:800;font-size:10px}
.rct-tbl td{border:1px solid #ccc;padding:3px 5px;vertical-align:middle;word-break:keep-all}
.rct-tbl td.rc-n{font-family:var(--fnum);text-align:right}
.rct-tbl .cat-cell{width:64px;text-align:center;background:#f5f7fa;font-weight:700;color:var(--navy);writing-mode:initial;font-size:11px}
.rct-tbl .item-cell{min-width:90px}
.rct-tbl .amt-cell{width:120px;font-family:var(--fnum);text-align:right}
.rct-tbl .bank-cell{width:90px;font-family:var(--fnum);text-align:right}
.rct-tbl .note-cell{width:80px}
/* SPON */
.spon-extra{display:none}.spon-extra.show{display:block}
/* DEPT REPORT ADD ROW */
.dr-add-btn{border:1.5px dashed var(--g4);background:var(--g6);border-radius:var(--r);
  padding:6px;text-align:center;cursor:pointer;color:var(--g2);font-size:12px;font-weight:700;
  transition:all .15s;margin-top:4px}
.dr-add-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-xp)}
/* ENTRY TABLE INLINE EDIT */
.entry-edit-inp{border:1.5px solid var(--blue);border-radius:4px;padding:2px 6px;
  font-size:12px;width:100%;background:#fff;font-family:var(--fn)}
.entry-edit-inp.num{font-family:var(--fnum);text-align:right}
/* DIVIDER */
.divider{height:1px;background:var(--g4);margin:12px 0}
/* HIDDEN */
.hidden{display:none!important}
/* PRINT */
@media print{
  .no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc}
  .hdr,.nav{display:none!important}
  .app{height:auto!important;overflow:visible!important}
  .content{overflow:visible!important;height:auto!important;padding:0!important}
  .tab-pane{display:none!important}
  .tab-pane.active{display:block!important}
  .result-section{display:block!important}
  @page{margin:8mm;size:A4 portrait}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:10px}
  /* 입금전표 한 장 최적화 */
  #receipt-content{page-break-inside:avoid;break-inside:avoid}
  #receipt-content table td,#receipt-content table th{padding:2px 5px!important;font-size:10px!important;line-height:1.3!important}
  #receipt-content .rct-title{font-size:15px!important}
  #receipt-content .approv-tbl td{height:28px!important;min-width:44px!important}
  .cat-cell{font-size:9px!important}
}
/* ===== 헌금유형 파스텔 행 색상 ===== */
.off-color-0  { background:#FFF0F0 !important; } /* 연분홍 */
.off-color-1  { background:#FFF5E6 !important; } /* 연주황 */
.off-color-2  { background:#FFFDE7 !important; } /* 연노랑 */
.off-color-3  { background:#F0FFF0 !important; } /* 연초록 */
.off-color-4  { background:#E8F5FF !important; } /* 연파랑 */
.off-color-5  { background:#F3E8FF !important; } /* 연보라 */
.off-color-6  { background:#FFE8F5 !important; } /* 연핑크 */
.off-color-7  { background:#E8FFFD !important; } /* 연민트 */
.off-color-8  { background:#FFF8E1 !important; } /* 연황금 */

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, getDoc, onSnapshot, deleteField,
    collection, getDocs, deleteDoc, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCkPtoF5GOq3IjJwoecpJ4e9Dyd7oZQTUU",
    authDomain: "skpc-accounting.firebaseapp.com",
    projectId: "skpc-accounting",
    storageBucket: "skpc-accounting.firebasestorage.app",
    messagingSenderId: "1035277328486",
    appId: "1:1035277328486:web:83b462a36a480f9e4a0da7"
  };
  let db;
  try {
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
    console.log('[Firebase] 앱 초기화 성공');
  } catch(e) {
    console.error('[Firebase] 앱 초기화 실패:', e);
    window._fbStatus && window._fbStatus('offline');
    window._appInit && window._appInit();
  }
  const MAIN_DOC  = doc(db, 'skpc', 'config');
  const DEPT_DOC  = doc(db, 'skpc_dept', 'report_data'); // 부서보고서 전용 별도 DB
  const COL_OFF   = collection(db, 'skpc_offerings');
  const COL_EXP   = collection(db, 'skpc_expenses');
  const COL_SPON  = collection(db, 'skpc_sponsors');
  // ── 초기 데이터 동기화 ──
  async function syncFromFirestore() {
    try {
      window._fbStatus && window._fbStatus('connecting');
      const [snap, deptSnap, offSnap, expSnap, sponSnap] = await Promise.all([
        getDoc(MAIN_DOC),
        getDoc(DEPT_DOC),
        getDocs(COL_OFF),
        getDocs(COL_EXP),
        getDocs(COL_SPON)
      ]);
      // 부서보고서 전용 DB 복원 (DEPT_DOC)
      if(deptSnap.exists()) {
        const deptData = deptSnap.data();
        Object.keys(deptData).forEach(function(k){
          try{localStorage.setItem(k, JSON.stringify(deptData[k]));}catch(e){}
        });
      }
      // config 문서 (MAIN_DOC)
      if(snap.exists()) {
        const data = snap.data();
        ['offeringTypes','deptTypes','sponsorTypes','recipients',
         'annualBudget','bankActual','deptOfficers'].forEach(k => {
          if(data[k] !== undefined) {
            try { localStorage.setItem(k, JSON.stringify(data[k])); } catch(e){}
          }
        });
        // [제거됨] 레거시 data.deptCustomRows 복원 → 660,000 부활 원인
        //   부서보고서 키는 DEPT_DOC에서만 복원 (개별 키 방식)
        // 부서보고서 키는 DEPT_DOC에서 별도 복원됨 (위 deptSnap 처리)
      }
      // 헌금
      const offerings = [];
      offSnap.forEach(d => offerings.push(d.data()));
      offerings.sort((a,b) => (a.date||'').localeCompare(b.date||''));
      localStorage.setItem('accountBook', JSON.stringify(offerings));
      // 지출
      const expenses = [];
      expSnap.forEach(d => expenses.push(d.data()));
      localStorage.setItem('expenseBook', JSON.stringify(expenses));
      // 찬조
      const sponsors = [];
      sponSnap.forEach(d => sponsors.push(d.data()));
      localStorage.setItem('sponsorBook', JSON.stringify(sponsors));
      console.log('[Firebase] 초기 동기화 완료 ✅');
      window._fbReady = true;
      window._fbStatus && window._fbStatus('online');
      window._appInit && window._appInit();
    } catch(e) {
      const msg = e.message || '';
      if(msg.includes('permission') || msg.includes('PERMISSION_DENIED')) {
        console.error('[Firebase] ❌ 보안 규칙 오류 - Firebase 콘솔에서 규칙을 확인하세요:', e);
        window._fbStatusMsg && window._fbStatusMsg('규칙 오류');
      } else if(msg.includes('unavailable') || msg.includes('network')) {
        console.error('[Firebase] ❌ 네트워크 오류:', e);
      } else {
        console.error('[Firebase] ❌ 연결 오류:', e);
      }
      window._fbStatus && window._fbStatus('offline');
      // 오프라인이어도 앱은 정상 실행 (localStorage 사용)
      window._appInit && window._appInit();
    }
  }
  // ── 실시간 리스너 ──
  function setupListeners() {
    // DEPT_DOC 실시간 리스너 추가 - 부서보고서 데이터 변경 즉시 반영
    onSnapshot(DEPT_DOC, (dSnap) => {
      if(!dSnap.exists()) return;
      // ★수정: 로컬 쓰기 직후 5초간은 서버 스냅샷 무시 (방금 쓴/삭제한 데이터 덮어쓰기 방지, 2초→5초)
      if(window._lastLocalWrite && (Date.now()-window._lastLocalWrite < 5000)) return;
      const dData = dSnap.data();
      Object.keys(dData).forEach(function(k){
        try{ localStorage.setItem(k, JSON.stringify(dData[k])); }catch(e){}
      });
      window._fbLiveRefreshDept && window._fbLiveRefreshDept();
    }, (err) => console.warn('[Firebase] DEPT 리스너:', err.message));
    onSnapshot(MAIN_DOC, (snap) => {
      if(!snap.exists()) return;
      const data = snap.data();
      ['offeringTypes','deptTypes','sponsorTypes','recipients',
       'annualBudget','bankActual','deptOfficers'].forEach(k => {
        if(data[k] !== undefined) {
          try { localStorage.setItem(k, JSON.stringify(data[k])); } catch(e){}
        }
      });
      // [제거됨] 레거시 data.deptCustomRows 복원 → 660,000 부활 원인
      window._fbLiveRefresh && window._fbLiveRefresh('config');
    }, (err) => {
      console.warn('[Firebase] config 리스너 오류:', err.message);
      window._fbStatus && window._fbStatus('offline');
    });
    onSnapshot(COL_OFF, (snap) => {
      const items = [];
      snap.forEach(d => items.push(d.data()));
      items.sort((a,b) => (a.date||'').localeCompare(b.date||''));
      localStorage.setItem('accountBook', JSON.stringify(items));
      window._fbLiveRefresh && window._fbLiveRefresh('accountBook');
    }, (err) => console.warn('[Firebase] offerings 리스너:', err.message));
    onSnapshot(COL_EXP, (snap) => {
      const items = [];
      snap.forEach(d => items.push(d.data()));
      localStorage.setItem('expenseBook', JSON.stringify(items));
      window._fbLiveRefresh && window._fbLiveRefresh('expenseBook');
    }, (err) => console.warn('[Firebase] expenses 리스너:', err.message));
    onSnapshot(COL_SPON, (snap) => {
      const items = [];
      snap.forEach(d => items.push(d.data()));
      localStorage.setItem('sponsorBook', JSON.stringify(items));
      window._fbLiveRefresh && window._fbLiveRefresh('sponsorBook');
    }, (err) => console.warn('[Firebase] sponsors 리스너:', err.message));
  }
  // ── 저장 함수들 ──
  window._fbSaveConfig = async function(key, value) {
    try {
      window._lastLocalWrite=Date.now(); // 로컬 쓰기 시각 기록 (onSnapshot race 방지)
      const DPFX=['deptTopRows_','deptView_','deptFootView_','deptYearView_','deptSavedAt_','deptCustomRows_','deptExpRows_'];
      const isDK=DPFX.some(function(p){return String(key).startsWith(p);})||(key==='deptOfficers');
      const targetDoc=isDK?DEPT_DOC:MAIN_DOC;
      await setDoc(targetDoc, { [key]: value }, { merge: true });
      window._fbStatus && window._fbStatus('saved');
    } catch(e) { console.error('[FB] config 저장 실패:', e.message); }
  };
  // ★수정: 여러 키를 한 번에 DEPT_DOC에 저장
  //   기존 이름 _fbSaveAll 은 아래 컬렉션용 _fbSaveAll(key,arr)에 의해 덮어써져
  //   부서 저장/삭제가 Firebase에 반영되지 않던 버그의 원인 → _fbSaveDeptAll 로 이름 변경
  window._fbSaveDeptAll = async function(dataObj) {
    try {
      window._lastLocalWrite=Date.now();
      await setDoc(DEPT_DOC, dataObj, { merge: true });
      window._fbStatus && window._fbStatus('saved');
    } catch(e) { console.error('[FB] 전체 저장 실패:', e.message); }
  };
  // 특정 키를 Firebase 문서에서 완전히 제거 (deleteField)
  window._fbDeleteKey = async function(key) {
    try {
      window._lastLocalWrite=Date.now();
      const DPFX=['deptTopRows_','deptView_','deptFootView_','deptYearView_','deptSavedAt_','deptCustomRows_','deptExpRows_'];
      const isDK=DPFX.some(function(p){return String(key).startsWith(p);})||(key==='deptOfficers');
      const targetDoc=isDK?DEPT_DOC:MAIN_DOC;
      await setDoc(targetDoc, { [key]: deleteField() }, { merge: true });
      console.log('[FB] 키 삭제 완료:', key);
    } catch(e) { console.error('[FB] 키 삭제 실패:', e.message); }
  };
  window._fbSaveConfigMulti = async function(obj) {
    try {
      await setDoc(MAIN_DOC, obj, { merge: true });
      window._fbStatus && window._fbStatus('saved');
    } catch(e) { console.error('[FB] config multi 저장 실패:', e.message); }
  };
  window._fbSaveAll = async function(key, arr) {
    let colPath;
    if(key==='accountBook') colPath='skpc_offerings';
    else if(key==='expenseBook') colPath='skpc_expenses';
    else if(key==='sponsorBook') colPath='skpc_sponsors';
    else return;
    try {
      window._fbStatus && window._fbStatus('saving');
      const batch = writeBatch(db);
      const snapAll = await getDocs(collection(db, colPath));
      snapAll.forEach(d => batch.delete(d.ref));
      arr.forEach(item => {
        if(item.id) batch.set(doc(db, colPath, item.id), item);
      });
      await batch.commit();
      window._fbStatus && window._fbStatus('saved');
    } catch(e) {
      console.error('[FB] saveAll 실패:', e.message);
      window._fbStatus && window._fbStatus('offline');
    }
  };
  window._fbDeleteItem = async function(colName, id) {
    let colPath;
    if(colName==='accountBook') colPath='skpc_offerings';
    else if(colName==='expenseBook') colPath='skpc_expenses';
    else if(colName==='sponsorBook') colPath='skpc_sponsors';
    else return;
    try {
      await deleteDoc(doc(db, colPath, id));
    } catch(e) { console.error('[FB] 삭제 실패:', e.message); }
  };
  // 상태 메시지 함수
  window._fbStatusMsg = function(msg) {
    const txt = document.getElementById('fbTxt');
    if(txt) txt.textContent = msg;
  };
  // 실행
  syncFromFirestore().then(() => setupListeners());
</script>
<script>
const ST={
  get(k,d=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},
  set(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));}catch{}
    // Firebase 동기화 (설정값만)
    const configKeys=['offeringTypes','deptTypes','sponsorTypes','recipients','annualBudget','bankActual','deptOfficers','carryover','writers'];
    if(configKeys.includes(k) && window._fbSaveConfig){
      window._fbSaveConfig(k,v);
    }
    // ★ 부서보고서 키는 ST.set 자동저장 안 함 (race condition 방지)
    //   → 명시적 함수(saveDeptToFirebase/updateDeptExpRow/deleteDept* 등)에서만 Firebase 저장
  }
};

// ============================================================
window.fmtAmt=function(el){
  const raw=el.value.replace(/[^0-9]/g,'');
  if(!raw){el.value='';return;}
  el.value=parseInt(raw).toLocaleString('ko-KR');
  el.dataset.raw=raw;
};
function getRaw(el){
  if(!el) return 0;
  const r=el.dataset.raw||el.value.replace(/[^0-9]/g,'');
  return parseInt(r)||0;
}

// Firebase 연결 상태 업데이트
window._fbStatus = function(status){
  const dot = document.getElementById('fbDot');
  const txt = document.getElementById('fbTxt');
  if(!dot||!txt) return;
  if(status==='online'){
    dot.style.background='#2ecc71';
    txt.textContent='Firebase 연결됨';
    txt.style.color='rgba(255,255,255,.9)';
  } else if(status==='offline'){
    dot.style.background='#e74c3c';
    txt.textContent='오프라인 모드';
    txt.style.color='rgba(255,200,200,.9)';
  } else if(status==='connecting'){
    dot.style.background='#f39c12';
    txt.textContent='연결 중...';
  } else if(status==='saving'){
    dot.style.background='#f39c12';
    txt.textContent='저장 중...';
  } else if(status==='saved'){
    dot.style.background='#2ecc71';
    txt.textContent='저장됨 ✓';
    setTimeout(()=>{if(window._fbReady) window._fbStatus('online');},1500);
  }
};

window._fbLiveRefresh = function(key){
  const activeTab = document.querySelector('.nav-item.active')?.dataset?.tab;
  if(!activeTab) return;
  const refreshMap = {
    'accountBook':  ['offering','query','weekly','receipt','monthly','bankbal','finsearch'],
    'expenseBook':  ['expense','monthly','deptreport','bankbal','finsearch','receipt'],
    'sponsorBook':  ['sponsor'],
    'config':       ['manage','monthly','bankbal']
  };
  const tabs = refreshMap[key] || [];
  if(tabs.includes(activeTab)){
    // 현재 탭 재활성화
    const tabEl = document.querySelector(`.nav-item[data-tab="${activeTab}"]`);
    if(tabEl){
      const evt = document.createEvent('MouseEvents');
      evt.initEvent('click',true,true);
      // 조용히 refresh (네비 클릭 없이)
      if(typeof onTabActivate === 'function') onTabActivate(activeTab);
    }
  }
};

function getCarryover(){return ST.get('carryover',{});}
function getCarryoverForYear(yr){
  const co=getCarryover();
  return parseN(co['year_'+yr]||'0');
}
// 월별 직접 입력 이월금 우선, 없으면 연도 기반 계산
function getCarryoverForMonth(yr,mo){
  const co=getCarryover();
  const mkey='month_'+yr+'_'+String(mo).padStart(2,'0');
  if(co[mkey]!==undefined&&co[mkey]!==null&&co[mkey]!=='') return parseN(co[mkey]);
  // 없으면 기본: 연도 이월금 사용 (renderMonthlyGeneral에서 계산)
  return null; // null이면 계산값 사용
}
// ── 일반회계 보고 ────────────────────────────────────────────
function renderMonthlyGeneral(ym){
  const [yr,mo]=ym.split('-').map(Number);
  const offerings=getOfferings().filter(e=>!e.spon);
  const expenses=getExpenses();
  const moOff=offerings.filter(e=>monthOf(e.date)===ym);
  const moExp=expenses.filter(e=>monthOf(e.date)===ym);
  const cumOff=offerings.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=ym);
  const cumExp=expenses.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=ym);
  // 이전 달 잔액
  const prevYm=mo===1?`${yr-1}-12`:`${yr}-${String(mo-1).padStart(2,'0')}`;
  const prevCumOff=offerings.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=prevYm);
  const prevCumExp=expenses.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=prevYm);
  const carryBase=getCarryoverForYear(yr);
  // 월별 직접 입력 이월금이 있으면 우선 사용 (이월금 설정에서 입력)
  const monthCarry=getCarryoverForMonth(yr,mo);
  const prevBal=monthCarry!==null ? monthCarry
    : carryBase+prevCumOff.reduce((s,e)=>s+Number(e.amount||0),0)-prevCumExp.reduce((s,e)=>s+Number(e.amount||0),0);
  // 수입 헌금유형 목록
  const incTypes=['십일조헌금','월정헌금','감사헌금','주일헌금','헌신예배','교회학교','장학헌금','부활절','맥추감사헌금','추수감사헌금','성탄절','일천번제','선교헌금','비전헌금','기타'];
  // 지출 부서 목록
  // ★ '건축대출금상환'은 제외하고 '건축대출금 상환(일반회계)'를 별도 항목으로 추가
  const outTypes=['총무부','관리부','차량부','친교부','미화부','선교부','경조부','예배부','영상매체부','교육부','장학위원회','재정부','감사부','건축대출금상환적금','대출금이자','건축대출금 상환(일반회계)'];
  const byTypeInc={};cumOff.forEach(e=>{byTypeInc[e.type]=(byTypeInc[e.type]||0)+Number(e.amount||0);});
  const byTypeMo={};moOff.forEach(e=>{byTypeMo[e.type]=(byTypeMo[e.type]||0)+Number(e.amount||0);});
  const byDeptCu={};cumExp.forEach(e=>{byDeptCu[e.dept]=(byDeptCu[e.dept]||0)+Number(e.amount||0);});
  const byDeptMo={};moExp.forEach(e=>{byDeptMo[e.dept]=(byDeptMo[e.dept]||0)+Number(e.amount||0);});
  const budget=getBudget();
  // ★ 수입 합계 = incTypes 목록 항목들의 합산 (목록에 없는 유형 제외)
  const cuIncTable=incTypes.reduce((s,t)=>s+(byTypeInc[t]||0),0);
  const moIncTable=incTypes.reduce((s,t)=>s+(byTypeMo[t]||0),0);
  // 총계용은 전체 헌금 합계 유지
  const moInc=moOff.reduce((s,e)=>s+Number(e.amount||0),0);
  const cuInc=cumOff.reduce((s,e)=>s+Number(e.amount||0),0);
  // ★ 지출 합계 = outTypes 목록 항목들의 합산
  //   '건축대출금 상환(일반회계)'는 DB의 '건축대출금상환' 부서 데이터를 제외하고 별도 입력값만 반영
  //   '건축대출금상환' 부서 실제 데이터는 합계에서 제외
  const EXCLUDE_DEPT='건축대출금상환'; // DB에서 이 부서는 합계 제외
  const cuExpTable=outTypes.reduce((s,d)=>{
    if(d==='건축대출금 상환(일반회계)') return s+(byDeptCu['건축대출금 상환(일반회계)']||0);
    return s+(byDeptCu[d]||0);
  },0);
  const moExpTable=outTypes.reduce((s,d)=>{
    if(d==='건축대출금 상환(일반회계)') return s+(byDeptMo['건축대출금 상환(일반회계)']||0);
    return s+(byDeptMo[d]||0);
  },0);
  // 총계용 지출 = 전체 - '건축대출금상환' 제외
  const moExpT=moExp.filter(e=>e.dept!==EXCLUDE_DEPT).reduce((s,e)=>s+Number(e.amount||0),0);
  const cuExpT=cumExp.filter(e=>e.dept!==EXCLUDE_DEPT).reduce((s,e)=>s+Number(e.amount||0),0);
  const bal=carryBase+cuInc-cuExpT;
  const budTotIn=incTypes.reduce((s,t)=>s+(parseN(budget['in_'+t])||0),0);
  const budTotOut=outTypes.reduce((s,d)=>s+(parseN(budget['out_'+d])||0),0);
  const totalYrPct=budTotIn?(Math.round((cuIncTable/budTotIn)*1000)/10)+'%':'—';
  const totalOutPct=budTotOut?(Math.round((cuExpTable/budTotOut)*1000)/10)+'%':'—';
  const el=document.getElementById('monthly-content');
  el.innerHTML=`
  <!-- PAGE 1: 총계 + 수입 -->
  <div class="monthly-section-1">
    <div class="rpt-hd"><h2>${yr}년 ${mo}월 일반 회계보고</h2></div>
    <div class="rpt-meta"><span>재정부장 유치주</span><span>재정부차장 —</span><span>회계 하태식</span></div>
    <div class="rpt-sub">(1) 총 계</div>
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
      <table class="tbl">
        <tbody>
          <tr><td style="font-weight:700;width:130px">이 월 금</td><td class="nc">${fmtN(prevBal)}</td>
              <td style="font-weight:700;width:130px">수입 누계</td><td class="nc">${fmtN(cuInc)}</td></tr>
          <tr><td style="font-weight:700">${mo}월 수입</td><td class="nc">${fmtN(moInc)}</td>
              <td style="font-weight:700">지출 누계</td><td class="nc">${fmtN(cuExpT)}</td></tr>
          <tr><td style="font-weight:700">${mo}월 지출</td><td class="nc">${fmtN(moExpT)}</td>
              <td style="font-weight:700;background:var(--blue-xp)">잔 액</td>
              <td class="nc" style="font-weight:800;color:var(--blue);background:var(--blue-xp)">${fmtN(bal)}</td></tr>
          <tr style="background:var(--gold-l)"><td style="font-weight:700">${mo}월 결산</td>
              <td class="nc" style="font-weight:800;color:var(--gold)">${fmtN(moInc-moExpT)}</td><td colspan="2"></td></tr>
        </tbody>
      </table>
    </div>
    <div class="rpt-sub">(2) 수입</div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="tbl">
        <thead><tr><th>항목</th><th class="nc">당년예산(A)</th><th class="nc">누계(B)</th><th class="nc">월계(C)</th><th class="nc">진도%(B/A)</th><th>비고</th></tr></thead>
        <tbody>
          ${incTypes.map(t=>{const bA=parseN(budget['in_'+t])||0;const bB=byTypeInc[t]||0;const bC=byTypeMo[t]||0;const pct=bA?Math.round(bB/bA*1000)/10:0;
            return `<tr><td>${t}</td><td class="nc">${bA?fmtN(bA):'—'}</td>
              <td class="nc" style="font-weight:${bB?'700':'400'}">${bB?fmtN(bB):'—'}</td>
              <td class="nc">${bC?fmtN(bC):'—'}</td>
              <td class="nc"><span style="color:${pct>50?'var(--green)':pct>30?'var(--gold)':'var(--g3)'}">${bA?pct+'%':'—'}</span></td>
              <td></td></tr>`;}).join('')}
        </tbody>
        <tfoot><tr><td>합계</td><td class="nc">${fmtN(budTotIn)}</td>
          <td class="nc" style="font-weight:800;color:var(--blue)">${fmtN(cuIncTable)}</td>
          <td class="nc">${fmtN(moIncTable)}</td><td class="nc">${totalYrPct}</td><td></td></tr></tfoot>
      </table>
    </div>
  </div>
  <!-- PAGE 2: 지출 -->
  <div class="print-page-break">
    <div class="rpt-hd" style="margin-top:10px"><h2>${yr}년 ${mo}월 일반 회계보고 (지출)</h2></div>

function getSpecialCarryBase(rptType,yr,mo,allOff,allExp){
  const co=getCarryover();
  // 관리에서 직접 입력한 연도 이월금
  const yearBase=parseN(co['special_'+rptType+'_'+yr]||'0');
  if(mo===1) return yearBase;
  // 전월까지 누계로 계산
  const prevYm=yr+'-'+String(mo-1).padStart(2,'0');
  const prevOff=allOff.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=prevYm);
  const prevExp=allExp.filter(e=>e.date.slice(0,4)===String(yr)&&monthOf(e.date)<=prevYm);
  return yearBase+prevOff.reduce((s,e)=>s+Number(e.amount||0),0)-prevExp.reduce((s,e)=>s+Number(e.amount||0),0);
}

window.runDeptDiag=function(){
  const ym=document.getElementById('dept-month').value;
  const dept=document.getElementById('diag-dept').value;
  const prefixes=['deptTopRows_','deptExpRows_','deptCustomRows_','deptView_','deptFootView_','deptYearView_','deptSavedAt_'];
  let html='<div style="font-weight:700;color:#1e3a5f;margin-bottom:8px">📋 '+ym+' / '+dept+' 저장 데이터</div>';
  let foundAny=false;
  prefixes.forEach(function(pfx){
    const key= pfx==='deptSavedAt_' ? (pfx+dept+'_'+ym) : (pfx+ym+'_'+dept);
    const val=ST.get(key,null);
    if(val!==null){
      const str=JSON.stringify(val);
      if(str!=='[]'&&str!=='{}'&&str!=='""'){
        foundAny=true;
        html+='<div style="margin-bottom:8px;padding:8px;background:#fff;border:1px solid #e2e8f0;border-radius:6px">';
        html+='<div style="font-weight:700;color:#0369a1;word-break:break-all">'+key+'</div>';
        html+='<div style="color:#475569;margin:4px 0;word-break:break-all;max-height:80px;overflow:auto">'+str.replace(/</g,'&lt;')+'</div>';
        html+='<button onclick="deleteRawKey(\''+key+'\')" style="background:#dc2626;color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px">이 키 삭제</button>';
        html+='</div>';
      }
    }
  });
  if(!foundAny) html+='<div style="color:#16a34a">✅ 저장된 데이터가 없습니다 (깨끗함)</div>';
  document.getElementById('diag-result').innerHTML=html;

// 특정 키 완전 삭제 (localStorage + Firebase)
window.deleteRawKey=function(key){
  if(!confirm('['+key+']\n이 데이터를 완전히 삭제하시겠습니까?\n(메인 지출DB는 영향 없음)')) return;
  // localStorage 삭제
  try{ localStorage.removeItem(key); }catch(e){}
  // Firebase에서도 삭제 (빈 값으로 덮어쓰기 → deleteField 사용)
  window._lastLocalWrite=Date.now();
  if(window._fbDeleteKey) window._fbDeleteKey(key);

// 부서 전체 데이터를 DEPT_DOC에 확정 저장 (삭제/수정 반영 보장)
window.saveDeptToFirebase=function(dept,ym){
  const now=new Date().toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const stKey='deptSavedAt_'+dept+'_'+ym;
  ST.set(stKey,now);
  const keys=[
    'deptTopRows_'+ym+'_'+dept,
    'deptExpRows_'+ym+'_'+dept,
    'deptCustomRows_'+ym+'_'+dept,
    'deptView_'+ym+'_'+dept,
    'deptFootView_'+ym+'_'+dept,
    'deptYearView_'+ym+'_'+dept
  ];
  const saveAll={};
  saveAll[stKey]=now;
  window._lastLocalWrite=Date.now();
  keys.forEach(function(k){
    const v=ST.get(k,null);
    const str=v===null?null:JSON.stringify(v);
    // 빈 배열/객체/null → Firebase에서 키 완전 제거 (deleteField), 부활 방지
    if(v===null||str==='[]'||str==='{}'){
      if(window._fbDeleteKey) window._fbDeleteKey(k);
    } else {
      saveAll[k]=v;
    }
  });
  // ★수정: DEPT_DOC 전용 저장 함수(_fbSaveDeptAll) 호출
  //   기존 _fbSaveAll(saveAll) 호출은 컬렉션용 _fbSaveAll(key,arr)에 걸려
  //   아무 것도 저장하지 않고 종료 → 삭제한 행이 부활하던 원인
  if(window._fbSaveDeptAll) window._fbSaveDeptAll(saveAll);
  else if(window._fbSaveConfig){
    Object.keys(saveAll).forEach(function(k){window._fbSaveConfig(k,saveAll[k]);});
  }
  renderDeptStatusBar && renderDeptStatusBar(dept);
};

window.doOnlineSearch=function(){
  // 온라인입금 전체 (모든 헌금유형, isOnlinePayment 헬퍼 사용)
  let books=getOfferings().filter(e=>isOnlinePayment(e));
  const df=document.getElementById('online-fdate')?.value||'';
  const tf=document.getElementById('online-ftype')?.value||'';
  const nf=(document.getElementById('online-fname')?.value||'').trim();
  if(df) books=books.filter(e=>e.date===df);
  if(tf) books=books.filter(e=>e.type===tf);
  if(nf) books=books.filter(e=>e.name?.includes(nf));
  const total=books.reduce((s,e)=>s+e.amount,0);
  const tbody=document.getElementById('online-tbody');
  if(tbody) tbody.innerHTML=books.map((e,i)=>`
    <tr>
      <td>${i+1}</td>
      <td style="font-family:var(--fnum)">${e.date}</td>
      <td style="font-family:var(--fnum)">${weekOfYear(e.date)}주차</td>
      <td><span class="badge ${e.type==='십일조헌금'?'b-navy':'b-blue'}">${e.type}</span></td>
      <td>${e.name}</td>
      <td class="nc" style="font-weight:700;color:var(--blue)">${fmtN(e.amount)}</td>
      <td><span class="badge b-green">온라인입금</span></td>
      <td>${e.memo||'—'}</td>
      <td><span class="badge b-gray">시트${e.sheet||1}</span></td>
    </tr>`).join('')||`<tr><td colspan="9" class="tbl-empty">데이터가 없습니다</td></tr>`;
  const ft=document.getElementById('online-foot-total');if(ft) ft.textContent=fmtN(total)+'원';
  const tot=document.getElementById('online-total');if(tot) tot.textContent=`${fmtN(total)}원 (${books.length}건)`;
  const cnt=document.getElementById('online-count');if(cnt) cnt.textContent=`${books.length}건`;
  // 헌금유형별 소계 (십일조/비전 기존 DOM 유지 + 동적 생성)
  const tijoBooks=books.filter(e=>e.type==='십일조헌금');
  const visionBooks=books.filter(e=>e.type==='비전헌금');
  const tijoTot=tijoBooks.reduce((s,e)=>s+e.amount,0);
  const visTot=visionBooks.reduce((s,e)=>s+e.amount,0);
  const tb1=document.getElementById('online-tijo-tbody');
  if(tb1) tb1.innerHTML=tijoBooks.map(e=>`<tr>
    <td style="font-family:var(--fnum)">${e.date}</td><td>${e.name}</td>
    <td class="nc" style="font-weight:700">${fmtN(e.amount)}</td><td>${e.memo||'—'}</td></tr>`).join('')
    ||`<tr><td colspan="4" class="tbl-empty">데이터 없음</td></tr>`;
  const tt=document.getElementById('online-tijo-total');if(tt) tt.textContent=fmtN(tijoTot)+'원';
  const tb2=document.getElementById('online-vision-tbody');
  if(tb2) tb2.innerHTML=visionBooks.map(e=>`<tr>
    <td style="font-family:var(--fnum)">${e.date}</td><td>${e.name}</td>
    <td class="nc" style="font-weight:700">${fmtN(e.amount)}</td><td>${e.memo||'—'}</td></tr>`).join('')
    ||`<tr><td colspan="4" class="tbl-empty">데이터 없음</td></tr>`;

const _typeColorMap={};
function getTypeColorIdx(type){
  if(_typeColorMap[type]===undefined){
    const keys=Object.keys(_typeColorMap);
    _typeColorMap[type]=keys.length%19;
  }
  return _typeColorMap[type];
}

  if(tf) books=books.filter(e=>e.type===tf);
  if(onf==='online')  books=books.filter(e=>e.online===true||e.online==='TRUE'||e.online==='true'||e.online==='온라인입금'||e.online==='1');
  if(onf==='offline') books=books.filter(e=>!e.online||e.online===false||e.online==='FALSE'||e.online==='false'||e.online==='현금입금');
  // 헌금구분 내림차순 → 성도성명 내림차순
  books.sort((a,b)=>{
    const tc=(b.type||'').localeCompare(a.type||'','ko');
    if(tc!==0) return tc;
    return (b.name||'').localeCompare(a.name||'','ko');
  });
  const tbody=document.getElementById('wky-tbody');
  if(tbody) tbody.innerHTML=books.map((e,i)=>{
    const ci=getTypeColorIdx(e.type);
    return `<tr class="off-color-${ci}">
      <td>${i+1}</td>
      <td style="font-family:var(--fnum)">${weekOfYear(e.date)}주차</td>
      <td style="font-family:var(--fnum)">${fmtMD(e.date)}(${dayKor(e.date)})</td>
      <td><span class="off-color-badge off-color-${ci}">${e.type}</span></td>
      <td>${e.name}</td>
      <td>${isOnlinePayment(e)?'<span style="background:#e3f2fd;color:#1565c0;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid #90caf9">🌐 온라인입금</span>':''}</td>
      <td>${e.memo||'—'}</td></tr>`;
  }).join('')||`<tr><td colspan="7" class="tbl-empty">데이터가 없습니다</td></tr>`;
  const res=document.getElementById('wky-result');if(res) res.classList.add('show');
};

window.dmLoadOfferings=function(){
  var data=getOfferings();
  const from=document.getElementById('dm-off-from')?.value||'';
  const to=document.getElementById('dm-off-to')?.value||'';
  const type=document.getElementById('dm-off-type')?.value||'';
  const name=(document.getElementById('dm-off-name')?.value||'').trim();
  const online=document.getElementById('dm-off-online')?.value||'';
  if(from) data=data.filter(e=>e.date>=from);
  if(to) data=data.filter(e=>e.date<=to);
  if(type) data=data.filter(e=>e.type===type);
  if(name) data=data.filter(e=>e.name?.includes(name));
  if(online){
    data=data.filter(function(e){
      const ov=e.online;
      const norm=(ov===true||ov==='TRUE'||ov==='true'||ov==='1'||ov==='온라인입금'||String(ov).toLowerCase()==='true')?'온라인입금':'현금입금';
      return norm===online;
    });
  }
  data.sort((a,b)=>b.date.localeCompare(a.date));
  const total=data.reduce((s,e)=>s+e.amount,0);
  const allOffTypes=getOffTypes();
  const tbody=document.getElementById('dm-off-tbody');
  if(tbody){
    tbody.innerHTML='';
    if(!data.length){
      const tr=document.createElement('tr');
      const td=document.createElement('td');td.colSpan=8;td.className='tbl-empty';
      td.textContent='데이터가 없습니다';tr.appendChild(td);tbody.appendChild(tr);
    } else {
      data.forEach(function(e,i){
        const tr=document.createElement('tr');
        // No
        const t0=document.createElement('td');t0.textContent=i+1;tr.appendChild(t0);
        // 날짜
        const t1=document.createElement('td');
        const iDate=document.createElement('input');iDate.type='date';iDate.value=e.date;
        iDate.style.cssText='border:none;background:transparent;font-family:var(--fnum);font-size:11px;width:96px';
        iDate.addEventListener('change',function(){dmUpdateOff(e.id,'date',this.value);});
        t1.appendChild(iDate);tr.appendChild(t1);
        // 헌금구분
        const t2=document.createElement('td');
        const selType=document.createElement('select');
        selType.style.cssText='border:none;background:transparent;font-size:11px;color:var(--navy);font-weight:700;width:100%';
        allOffTypes.forEach(function(tp){const o=document.createElement('option');o.value=tp;o.textContent=tp;if(tp===e.type)o.selected=true;selType.appendChild(o);});
        selType.addEventListener('change',function(){dmUpdateOff(e.id,'type',this.value);});
        t2.appendChild(selType);tr.appendChild(t2);
        // 성도명
        const t3=document.createElement('td');
        const iName=document.createElement('input');iName.value=e.name||'';
        iName.style.cssText='border:none;border-bottom:1px dashed var(--g4);background:transparent;font-size:12px;width:100%';
        iName.addEventListener('change',function(){dmUpdateOff(e.id,'name',this.value);});
        t3.appendChild(iName);tr.appendChild(t3);
        // 금액
        const t4=document.createElement('td');t4.className='nc';
        const iAmt=document.createElement('input');iAmt.value=fmtN(e.amount);
        iAmt.style.cssText='border:none;border-bottom:1px dashed var(--g4);background:transparent;font-family:var(--fnum);font-size:12px;text-align:right;width:90px;color:var(--blue)';
        iAmt.addEventListener('input',function(){fmtAmt(this);});
        iAmt.addEventListener('change',function(){dmUpdateOff(e.id,'amount',getRaw(this));});
        t4.appendChild(iAmt);tr.appendChild(t4);
        // 입금방식
        const t5=document.createElement('td');
        const selOnl=document.createElement('select');
        selOnl.style.cssText='border:none;background:transparent;font-size:11px;width:100%';
        // online 값 정규화: true/'TRUE'/'true' → '온라인입금'
        const onlineNorm=(function(v){
          if(v===true||v==='TRUE'||v==='true'||v==='1'||String(v).toLowerCase()==='true') return '온라인입금';
          if(v==='온라인입금') return '온라인입금';
          return '현금입금';
        })(e.online);
        // DB에 정규화된 값 저장 (true→온라인입금)
        if(e.online!==onlineNorm){
          const arr=getOfferings();
          const oi=arr.findIndex(function(x){return x.id===e.id;});
          if(oi>=0){arr[oi].online=onlineNorm;setOfferings(arr);}

window.dmLoadExpenses=function(){

        iDate.addEventListener('change',function(){dmUpdateExp(e.id,'date',this.value);});

        // 부서
        const t2=document.createElement('td');

        allDeptTypes.forEach(function(d){const o=document.createElement('option');o.value=d;o.textContent=d;if(d===e.dept)o.selected=true;selDept.appendChild(o);});
        selDept.addEventListener('change',function(){dmUpdateExp(e.id,'dept',this.value);});
        t2.appendChild(selDept);tr.appendChild(t2);
        // 요청자, 수취자, 계좌
        // 요청자/수취자/계좌 - 구버전(recip,acc) 호환
        [{f:'requester',fb:null,w:'60px'},{f:'recipient',fb:'recip',w:'80px'},{f:'account',fb:'acc',w:'110px'}].forEach(function(fc,fi){
          const td=document.createElement('td');
          const val=e[fc.f]||(fc.fb?e[fc.fb]:'');
          const families=[null,null,'var(--fnum)'];
          const colors=[null,null,'var(--g2)'];

          if(fi===2) inp.style.fontSize='10px';
          td.appendChild(inp);tr.appendChild(td);
        });
        // 금액
        const t6=document.createElement('td');t6.className='nc';

function initMonthSel(selId,badgeId){
  const sel=document.getElementById(selId);if(!sel||sel.options.length>0) return;
  // 시작 연도(2026)부터 당월 +1개월까지 표시
  // - 2026년 이전(2025 등)은 제외
  // - 당월 다음달까지 표시 (12월이면 다음해 1월로 넘어감)
  // - 연도가 바뀌어도 시작연도(2026)부터 계속 누적 표시
  const START_YEAR=2026;
  // 마지막 표시 시점 = 당월 +1개월 (연/월 계산)
  let endY=CUR_YEAR, endM=CUR_MONTH+1;
  if(endM>12){ endM=1; endY=CUR_YEAR+1; }
  // 시작(START_YEAR-01) ~ 끝(endY-endM)까지 월 목록 생성 (최신이 위로)
  const months=[];
  for(let y=START_YEAR; y<=endY; y++){
    const mEnd=(y===endY)?endM:12;
    for(let m=1; m<=mEnd; m++){ months.push({y:y,m:m}); }
  }
  months.reverse(); // 최신 월이 맨 위
  months.forEach(function(mm){
    const val=mm.y+'-'+String(mm.m).padStart(2,'0');
    const opt=document.createElement('option');opt.value=val;
    opt.textContent=mm.y+'년 '+mm.m+'월';
    if(mm.y===CUR_YEAR&&mm.m===CUR_MONTH) opt.selected=true; // 당월 기본 선택
    sel.appendChild(opt);
  });
  updateMonthBadge(selId,badgeId);
  sel.onchange=()=>updateMonthBadge(selId,badgeId);
}
function updateMonthBadge(selId,badgeId){
  const sel=document.getElementById(selId);const bdg=document.getElementById(badgeId);
  if(!sel||!bdg) return;
  const v=sel.value;if(!v) return;
  const [yr,mo]=v.split('-');bdg.textContent=`${yr}년 ${parseInt(mo)}월`;
}

const deptEditState={};
window.saveDeptNow=function(dept,ym){
  const now=new Date().toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  // 타임스탬프
  const stKey='deptSavedAt_'+dept+'_'+ym;
  ST.set(stKey,now);
  // 부서 전체 데이터를 한 번에 DEPT_DOC에 저장
  const saveAll={
    [stKey]: now,
    ['deptTopRows_'+ym+'_'+dept]: ST.get('deptTopRows_'+ym+'_'+dept,[]),
    ['deptExpRows_'+ym+'_'+dept]: ST.get('deptExpRows_'+ym+'_'+dept,[]),
    ['deptCustomRows_'+ym+'_'+dept]: ST.get('deptCustomRows_'+ym+'_'+dept,[]),
    ['deptView_'+ym+'_'+dept]: ST.get('deptView_'+ym+'_'+dept,{}),
    ['deptFootView_'+ym+'_'+dept]: ST.get('deptFootView_'+ym+'_'+dept,{}),
    ['deptYearView_'+ym+'_'+dept]: ST.get('deptYearView_'+ym+'_'+dept,{}),
    ['deptOfficers']: ST.get('deptOfficers',{})
  };
  // ★수정: DEPT_DOC 전용 저장 함수(_fbSaveDeptAll) 호출
  //   기존 _fbSaveAll(saveAll) 호출은 컬렉션용 _fbSaveAll(key,arr)에 걸려
  //   조용히 아무것도 저장하지 않음 → 💾 저장 버튼이 작동하지 않던 원인
  if(window._fbSaveDeptAll) window._fbSaveDeptAll(saveAll);
  else if(window._fbSaveConfig){
    Object.keys(saveAll).forEach(function(k){window._fbSaveConfig(k,saveAll[k]);});
  }
  renderDeptStatusBar(dept);
  const bar=document.getElementById('deptBar_'+CSS.escape(dept));
  if(bar){
    bar.style.background='rgba(39,174,96,.3)';
    setTimeout(function(){bar.style.background='rgba(255,255,255,.07)';},1500);
  }
};
window.startDeptEdit=function(dept){

window.saveDeptEdit=function(dept,ym){
  const now=new Date().toLocaleString('ko-KR');
  deptEditState[dept]='saved';
  const k='deptSavedAt_'+dept+'_'+ym;ST.set(k,now);

  setTimeout(()=>{if(deptEditState[dept]==='saved')deptEditState[dept]='idle';renderDeptStatusBar(dept);},3000);
};

  const bar=document.getElementById('deptBar_'+CSS.escape(dept));

  const ym=document.getElementById('dept-month')?.value||'';
  const savedAt=ST.get('deptSavedAt_'+dept+'_'+ym,'');

    +(savedAt

//   중복 정의(Firebase 저장 없는 버전)는 앞의 정상 버전(Firebase 저장 포함)을
