<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육부찬조 부서별 배분 현황 — 서부광성교회</title>
<style>
  :root{
    --navy:#1e3a5f; --blue:#2471a3; --gold:#b8860b; --red:#c0392b;
    --g2:#546e8a; --g3:#94a3b8; --g4:#d5deea;
    --fnum:'Arial','Helvetica Neue',sans-serif;
    --sh:0 2px 8px rgba(0,0,0,.08); --rl:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nanum Gothic','Malgun Gothic',sans-serif;background:#f0f4f8;color:#2c3e50;padding:20px}
  .wrap{max-width:1000px;margin:0 auto}
  .hd{background:linear-gradient(135deg,#1e3a5f,#2471a3);color:#fff;padding:20px 24px;border-radius:12px;margin-bottom:18px;box-shadow:var(--sh)}
  .hd h1{font-size:22px;font-weight:800;letter-spacing:1px}
  .hd .sub{font-size:12px;opacity:.85;margin-top:4px}
  .bar{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);flex-wrap:wrap}
  .bar label{font-size:12px;font-weight:800;color:var(--g2)}
  .bar select,.bar input{height:34px;padding:0 10px;border:1.5px solid var(--g4);border-radius:8px;font-size:13px}
  .btn{height:34px;padding:0 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-outline{background:#fff;border:1.5px solid var(--g4);color:var(--g2)}
  .card{background:#fff;border:1px solid var(--g4);border-radius:var(--rl);padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
  .card-title{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e8eff6}
  table{width:100%;border-collapse:collapse}
  th{background:#e8eff6;padding:10px 12px;text-align:left;font-size:12px;font-weight:800;color:var(--navy);border-bottom:2px solid var(--g4)}
  td{padding:9px 12px;font-size:13px;border-bottom:1px solid #eef2f7}
  .num{text-align:right;font-family:var(--fnum);font-weight:700}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--g4);border-radius:10px;padding:14px;text-align:center;box-shadow:var(--sh)}
  .stat-lbl{font-size:11px;color:var(--g2);font-weight:700}
  .stat-val{font-size:20px;font-weight:900;color:var(--navy);font-family:var(--fnum);margin-top:4px}
  .stat.gold .stat-val{color:var(--gold)}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fdf6e3;color:var(--gold)}
  .tot-row td{font-weight:900;color:var(--navy);background:#f0f4f9;border-top:2px solid var(--g4)}
  .loading{text-align:center;padding:40px;color:var(--g3)}
  .back{display:inline-block;margin-bottom:14px;color:var(--blue);text-decoration:none;font-size:13px;font-weight:700}
  .neg{color:var(--red)!important}
  .pos{color:#1a7a4a!important}
  @media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back">← 회계 시스템으로 돌아가기</a>
  <div class="hd">
    <h1>📊 교육부찬조 부서별 배분 현황</h1>
    <div class="sub">서부광성교회 · Seobukwangseong Presbyterian Church</div>
  </div>

  <div class="bar">
    <label>조회 기간</label>
    <input type="date" id="from-date">
    <span>~</span>
    <input type="date" id="to-date">
    <button class="btn btn-navy" onclick="loadData()">🔍 조회</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ 인쇄</button>
  </div>

  <div id="content"><div class="loading">데이터를 불러오는 중...</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, getDocs, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCkPtoF5GOq3IjJwoecpJ4e9Dyd7oZQTUU",
    authDomain: "skpc-accounting.firebaseapp.com",
    projectId: "skpc-accounting",
    storageBucket: "skpc-accounting.firebasestorage.app",
    messagingSenderId: "1035277328486",
    appId: "1:1035277328486:web:83b462a36a480f9e4a0da7"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COL_OFF = collection(db, 'skpc_offerings');
  const COL_SPON = collection(db, 'skpc_sponsors');
  const COL_EXP = collection(db, 'skpc_expenses');

  // Firebase에서 데이터 로드 → localStorage 저장
  async function syncData(){
    try{
      const [offSnap, sponSnap, expSnap] = await Promise.all([getDocs(COL_OFF), getDocs(COL_SPON), getDocs(COL_EXP)]);
      const offerings=[]; offSnap.forEach(d=>offerings.push(d.data()));
      const sponsors=[]; sponSnap.forEach(d=>sponsors.push(d.data()));
      const expenses=[]; expSnap.forEach(d=>expenses.push(d.data()));
      localStorage.setItem('accountBook', JSON.stringify(offerings));
      localStorage.setItem('sponsorBook', JSON.stringify(sponsors));
      localStorage.setItem('expenseBook', JSON.stringify(expenses));
      return true;
    }catch(e){ console.error('[Firebase]', e.message); return false; }
  }

  window._eduReady = false;
  syncData().then(function(){ window._eduReady=true; loadData(); });
</script>

<script>
  const ST={ get(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}} };
  const getOfferings=()=>ST.get('accountBook',[]);
  const getSponsors=()=>ST.get('sponsorBook',[]);
  const getExpenses=()=>ST.get('expenseBook',[]);
  function fmtN(n){return (Number(n)||0).toLocaleString('ko-KR');}
  function monthOf(d){return String(d||'').slice(0,7);}

  // 수취자 → 부서 매핑 (지급 내역을 부서별로 귀속)
  const RECIPIENT_DEPT={
    '최희지':'청년부', '김하준':'청년부',
    '김미선':'아동부',
    '김여진':'유치부',
    '권순호':'중고등부'
  };
  // 수취자 이름으로 부서 추정 (매핑에 없으면 내용/부서에서 추출)
  function recipientToDept(recipient, content){
    var r=String(recipient||'').trim();
    if(RECIPIENT_DEPT[r]) return RECIPIENT_DEPT[r];
    // 내용에 부서명이 있으면 사용
    var c=String(content||'');
    var depts=['유치부','아동부','중고등부','청년부'];
    for(var i=0;i<depts.length;i++){ if(c.includes(depts[i])) return depts[i]; }
    return '기타';
  }

  // 기본 기간: 당해년 1월 1일 ~ 오늘
  (function initDates(){
    const now=new Date();
    const y=now.getFullYear();
    const from=document.getElementById('from-date');
    const to=document.getElementById('to-date');
    if(from) from.value=y+'-01-01';
    if(to) to.value=now.toISOString().slice(0,10);
  })();

  window.loadData=function(){
    const fromDate=document.getElementById('from-date')?.value||'';
    const toDate=document.getElementById('to-date')?.value||'';
    const allOfferings=getOfferings();
    const allSponsors=getSponsors();

    function inRange(d){ return (!fromDate||d>=fromDate)&&(!toDate||d<=toDate); }

    // ── 교육부찬조 수집 (index.html renderSponDistAndPay와 동일 로직) ──
    // 방법1: 헌금내역 type에 '교육부찬조'
    const offerByType=allOfferings.filter(function(e){
      return inRange(e.date)&&String(e.type||'').includes('교육부찬조');
    });
    // 방법2: 헌금내역 memo에 '교육부찬조' (type은 일반)
    const offerByMemo=allOfferings.filter(function(e){
      return inRange(e.date)&&!String(e.type||'').includes('교육부찬조')
        &&String(e.memo||'').includes('교육부찬조');
    });
    // 방법3: 찬조내역 type에 '교육부찬조'
    const sponsorEdu=allSponsors.filter(function(e){
      return inRange(e.date)&&String(e.type||'').includes('교육부찬조');
    });
    // 방법4: spon 필드에 '교육부찬조' (type/memo에 없는 경우만)
    const offerBySpon=allOfferings.filter(function(e){
      return inRange(e.date)&&String(e.spon||'').includes('교육부찬조')
        &&!String(e.type||'').includes('교육부찬조')
        &&!String(e.memo||'').includes('교육부찬조');
    });

    // ── 지정/미지정 분류 ──
    const designated={유치부:0,아동부:0,중고등부:0,청년부:0};
    let undesigTotal=0;
    const detailRows=[];

    function classify(e, typeStr){
      const amt=Number(e.amount||0);
      if(!amt) return;
      const m=typeStr.match(/교육부찬조[（(]([^）)]+)[）)]/);
      let deptLabel='미지정';
      if(m){
        const dept=m[1].trim();
        if(designated.hasOwnProperty(dept)){ designated[dept]+=amt; deptLabel=dept; }
        else if(dept==='미지정'){ undesigTotal+=amt; deptLabel='미지정'; }
        else { undesigTotal+=amt; deptLabel=dept+'(미등록)'; }
      } else {
        undesigTotal+=amt; deptLabel='미지정';
      }
      detailRows.push({date:e.date, name:e.name||'', type:typeStr, amount:amt, dept:deptLabel});
    }

    offerByType.forEach(function(e){ classify(e, String(e.type||'')); });
    offerByMemo.forEach(function(e){ classify(e, String(e.memo||'')); });
    sponsorEdu.forEach(function(e){ classify(e, String(e.type||'')); });
    offerBySpon.forEach(function(e){ classify(e, String(e.spon||'')); });

    const desigTotal=designated.유치부+designated.아동부+designated.중고등부+designated.청년부;
    const grandTotal=desigTotal+undesigTotal;

    // 미지정 4등분 (4개 부서에 균등 배분)
    const undesigShare=Math.round(undesigTotal/4);
    const finalDept={
      유치부:designated.유치부+undesigShare,
      아동부:designated.아동부+undesigShare,
      중고등부:designated.중고등부+undesigShare,
      청년부:designated.청년부+undesigShare
    };

    // ── 지급 내역 수집 (지출내역 expenseBook 중 dept='교육부찬조'인 것만) ──
    const allExpenses=getExpenses();
    const payouts=allExpenses.filter(function(e){
      return inRange(e.date)&&String(e.dept||'')==='교육부찬조';
    }).map(function(e){
      var dept=recipientToDept(e.recipient, e.content);
      return {date:e.date, dept:dept, content:e.content||'', amount:Number(e.amount||0), recipient:e.recipient||''};
    }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});

    // 부서별 지급 합계
    const paidByDept={유치부:0,아동부:0,중고등부:0,청년부:0,기타:0};
    payouts.forEach(function(p){
      if(paidByDept.hasOwnProperty(p.dept)) paidByDept[p.dept]+=p.amount;
      else paidByDept['기타']+=p.amount;
    });
    const paidTotal=payouts.reduce(function(s,p){return s+p.amount;},0);

    // 부서별 잔액 = 배분(finalDept) - 지급(paidByDept)
    const balDept={
      유치부:finalDept.유치부-paidByDept.유치부,
      아동부:finalDept.아동부-paidByDept.아동부,
      중고등부:finalDept.중고등부-paidByDept.중고등부,
      청년부:finalDept.청년부-paidByDept.청년부
    };
    const balTotal=grandTotal-paidTotal;

    // ── 렌더링 ──
    let html='';
    // 통계
    html+='<div class="stat-row">'
      +'<div class="stat gold"><div class="stat-lbl">교육부찬조 총액</div><div class="stat-val">'+fmtN(grandTotal)+'</div></div>'
      +'<div class="stat"><div class="stat-lbl">지급 합계</div><div class="stat-val">'+fmtN(paidTotal)+'</div></div>'
      +'<div class="stat"><div class="stat-lbl">잔액</div><div class="stat-val '+(balTotal>=0?'pos':'neg')+'">'+fmtN(balTotal)+'</div></div>'
      +'</div>';

    // 부서별 배분 + 지급 + 잔액 표
    html+='<div class="card"><div class="card-title">부서별 찬조 합계 · 지급 · 잔액</div>'
      +'<table><thead><tr><th>부서</th>'
      +'<th style="text-align:right">배분 합계</th>'
      +'<th style="text-align:right">지급액</th>'
      +'<th style="text-align:right">잔액</th></tr></thead><tbody>';
    ['유치부','아동부','중고등부','청년부'].forEach(function(d){
      var bal=balDept[d];
      html+='<tr><td><span class="badge">'+d+'</span></td>'
        +'<td class="num" style="color:var(--gold)">'+fmtN(finalDept[d])+'</td>'
        +'<td class="num">'+fmtN(paidByDept[d])+'</td>'
        +'<td class="num '+(bal>=0?'pos':'neg')+'">'+fmtN(bal)+'</td></tr>';
    });
    // 기타 지급이 있으면 표시
    if(paidByDept['기타']>0){
      html+='<tr><td><span class="badge" style="background:#f0f0f0;color:#888">기타</span></td>'
        +'<td class="num">—</td>'
        +'<td class="num">'+fmtN(paidByDept['기타'])+'</td>'
        +'<td class="num neg">'+fmtN(-paidByDept['기타'])+'</td></tr>';
    }
    html+='<tr class="tot-row"><td>합 계</td>'
      +'<td class="num">'+fmtN(grandTotal)+'</td>'
      +'<td class="num">'+fmtN(paidTotal)+'</td>'
      +'<td class="num '+(balTotal>=0?'pos':'neg')+'">'+fmtN(balTotal)+'</td></tr>';
    html+='</tbody></table></div>';

    // 지급 내역 (지출내역에서 가져온 교육부찬조 지급건)
    html+='<div class="card"><div class="card-title">💸 지급 내역 ('+payouts.length+'건)</div>'
      +'<table><thead><tr><th>입금일자</th><th>소속</th><th>내용</th><th style="text-align:right">금액</th><th>수취자</th></tr></thead><tbody>';
    if(payouts.length){
      payouts.forEach(function(p){
        html+='<tr><td style="font-family:var(--fnum);font-size:12px">'+p.date+'</td>'
          +'<td><span class="badge">'+p.dept+'</span></td>'
          +'<td style="font-size:12px">'+p.content+'</td>'
          +'<td class="num">'+fmtN(p.amount)+'</td>'
          +'<td>'+p.recipient+'</td></tr>';
      });
      html+='<tr class="tot-row"><td colspan="3">지급 합계</td><td class="num">'+fmtN(paidTotal)+'</td><td></td></tr>';
    } else {
      html+='<tr><td colspan="5" style="text-align:center;color:var(--g3);padding:20px">해당 기간 교육부찬조 지급 내역이 없습니다.<br><span style="font-size:11px">(지출내역에서 부서를 \'교육부찬조\'로 입력한 건이 표시됩니다)</span></td></tr>';
    }
    html+='</tbody></table></div>';

    // 배분 상세 (지정/미지정 4등분)
    html+='<div class="card no-print" style="background:#fafbff"><div class="card-title">배분 상세 (지정 + 미지정 4등분)</div>'
      +'<table><thead><tr><th>부서</th><th style="text-align:right">지정 배분</th><th style="text-align:right">미지정 배분</th><th style="text-align:right">배분 합계</th></tr></thead><tbody>';
    ['유치부','아동부','중고등부','청년부'].forEach(function(d){
      html+='<tr><td><span class="badge">'+d+'</span></td>'
        +'<td class="num">'+fmtN(designated[d])+'</td>'
        +'<td class="num">'+fmtN(undesigShare)+'</td>'
        +'<td class="num" style="color:var(--gold)">'+fmtN(finalDept[d])+'</td></tr>';
    });
    html+='<tr class="tot-row"><td>합 계</td>'
      +'<td class="num">'+fmtN(desigTotal)+'</td>'
      +'<td class="num">'+fmtN(undesigShare*4)+'</td>'
      +'<td class="num">'+fmtN(grandTotal)+'</td></tr>';
    html+='</tbody></table></div>';

    // 상세 내역
    detailRows.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    html+='<div class="card no-print"><div class="card-title">교육부찬조 수입 상세 내역 ('+detailRows.length+'건)</div>'
      +'<table><thead><tr><th>일자</th><th>성도명</th><th>구분</th><th>배분 부서</th><th style="text-align:right">금액</th></tr></thead><tbody>';
    if(detailRows.length){
      detailRows.forEach(function(r){
        html+='<tr><td style="font-family:var(--fnum);font-size:12px">'+r.date+'</td>'
          +'<td>'+r.name+'</td>'
          +'<td style="font-size:12px">'+r.type+'</td>'
          +'<td><span class="badge">'+r.dept+'</span></td>'
          +'<td class="num">'+fmtN(r.amount)+'</td></tr>';
      });
      html+='<tr class="tot-row"><td colspan="4">합 계</td><td class="num">'+fmtN(grandTotal)+'</td></tr>';
    } else {
      html+='<tr><td colspan="5" style="text-align:center;color:var(--g3);padding:20px">해당 기간 교육부찬조 내역이 없습니다.</td></tr>';
    }
    html+='</tbody></table></div>';

    document.getElementById('content').innerHTML=html;
  };
</script>
</body>
</html>
